# Path-scoped allow rules for trivy's secret scanner: only the intentionally fake
# examples that test the secret-detection skill. Everything else is still scanned.
allow-rules:
  - id: secret-skill-examples
    description: Fake credentials used as rule examples
    path: '.*skills/security/secrets/skill\.toml$'
  - id: benchmark-fixtures
    description: Fake credentials in protected benchmark fixtures
    path: '.*benchmarks/fixtures/.*'
