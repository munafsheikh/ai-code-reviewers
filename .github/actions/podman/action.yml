name: Podman
description: >-
  Rootless Podman API service for `podman compose` (the runner image ships Podman and
  docker-compose, which podman compose uses as its provider). Every job that builds or
  runs containers uses this step first.
runs:
  using: composite
  steps:
    - name: Start the Podman API service
      shell: bash
      run: |
        # The runner's AppArmor policy stops Podman from signalling pasta, so containers on
        # compose networks cannot be removed; slirp4netns as the rootless network has no such limit.
        command -v slirp4netns >/dev/null || sudo apt-get install -y -qq slirp4netns >/dev/null
        mkdir -p ~/.config/containers
        printf '[network]\ndefault_rootless_network_cmd = "slirp4netns"\n' > ~/.config/containers/containers.conf
        sock="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock"
        # Socket activation keeps the service and its rootless network processes in the user's
        # systemd session, so later steps can stop them; a plain background service is the fallback.
        if ! systemctl --user start podman.socket 2>/dev/null; then
          mkdir -p "$(dirname "$sock")"
          nohup podman system service --time=0 "unix://$sock" >/dev/null 2>&1 &
        fi
        for _ in $(seq 1 40); do [ -S "$sock" ] && break; sleep 0.25; done
        [ -S "$sock" ] || { echo "Podman API socket did not start: $sock" >&2; exit 1; }
        podman --version
        podman compose version
