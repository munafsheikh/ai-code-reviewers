name: Deploy (test environment)
# Disposable test environment on the runner: deploy the last verified release first,
# then the candidate; smoke-test; roll back automatically when the candidate is unhealthy.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      image:
        description: candidate image (ref or digest)
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Resolve candidate and last verified release
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=$(gh release list --limit 2 --json tagName -q '.[].tagName')
          cand="${{ inputs.image }}"; [ -n "$cand" ] || cand="$repo:$(echo "$tags" | sed -n 1p | sed 's/^v//')"
          prev=$(echo "$tags" | sed -n 2p | sed 's/^v//')
          echo "candidate=$cand" >> "$GITHUB_OUTPUT"
          echo "previous=${prev:+$repo:$prev}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: startsWith(steps.r.outputs.candidate, 'ghcr.io/')
      - name: Verify signature of candidate (refuse unsigned images)
        if: startsWith(steps.r.outputs.candidate, 'ghcr.io/')
        run: |
          cosign verify "${{ steps.r.outputs.candidate }}" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      - name: Establish last verified release
        if: steps.r.outputs.previous != ''
        run: docker pull -q "${{ steps.r.outputs.previous }}" && infrastructure/deployment/deploy.sh "${{ steps.r.outputs.previous }}"
      - name: Deploy candidate (auto-rollback on failure)
        run: docker pull -q "${{ steps.r.outputs.candidate }}" && infrastructure/deployment/deploy.sh "${{ steps.r.outputs.candidate }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: deploy-state, path: out/deploy, retention-days: 90}
      - if: always()
        run: infrastructure/deployment/teardown.sh
