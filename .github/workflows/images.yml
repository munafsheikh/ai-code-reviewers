name: Images
# Publish every image to Docker Hub in two stages, from the one multi-stage Dockerfile:
#   1. base                          -> <ns>/ai-code-reviewers-base
#   2. layered on the base *digest*  -> <ns>/ai-code-reviewers (reviewer, scan-gated)
#                                       <ns>/ai-code-reviewers-toolbox
#                                       <ns>/ai-code-reviewers-fake-runtime
# Tags: green CI on main -> edge, sha-<12>; release vX.Y.Z -> X.Y.Z, X.Y, latest.
# Multi-arch (amd64, arm64), BuildKit SBOM + provenance, keyless cosign signatures.
# Setup: secrets DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (read/write access token);
# optional variable DOCKERHUB_NAMESPACE (defaults to the GitHub owner).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: release version (X.Y.Z or vX.Y.Z); empty publishes edge tags
        type: string
        default: ""
  workflow_call:
    inputs:
      version:
        description: release version (X.Y.Z or vX.Y.Z); empty publishes edge tags
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME: {required: true}
      DOCKERHUB_TOKEN: {required: true}

permissions:
  contents: read

concurrency:
  group: images-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  DOCKERFILE: infrastructure/docker/Dockerfile
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  meta:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      namespace: ${{ steps.m.outputs.namespace }}
      revision: ${{ steps.m.outputs.revision }}
      version: ${{ steps.m.outputs.version }}
      tags: ${{ steps.m.outputs.tags }}
    steps:
      - id: m
        env:
          NS: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          v="${VERSION#v}"
          if [ -n "$v" ]; then
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $VERSION" >&2; exit 1; }
            tags="$v ${v%.*} latest"
          else
            v="0.0.0-edge"; tags="edge sha-${REVISION:0:12}"
          fi
          { echo "namespace=${NS,,}"; echo "revision=$REVISION"; echo "version=$v"; echo "tags=$tags"; } >> "$GITHUB_OUTPUT"
          echo "Publishing \`${NS,,}/ai-code-reviewers*\` tags: \`$tags\` @ \`$REVISION\`" >> "$GITHUB_STEP_SUMMARY"

  base:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write          # keyless signing
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    env:
      REPO: docker.io/${{ needs.meta.outputs.namespace }}/ai-code-reviewers-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.meta.outputs.revision }}"}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tags
        run: printf 'list<<EOF\n%s\nEOF\n' "$(for t in ${{ needs.meta.outputs.tags }}; do echo "$REPO:$t"; done)" >> "$GITHUB_OUTPUT"
      - name: Build and push base
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: base
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            REVISION=${{ needs.meta.outputs.revision }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max
      - id: ref
        run: echo "ref=$REPO@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - run: cosign sign --yes "${{ steps.ref.outputs.ref }}"

  images:
    needs: [meta, base]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: reviewer, repo: ai-code-reviewers, scan: true}
          - {target: toolbox, repo: ai-code-reviewers-toolbox, scan: false}
          - {target: fake-runtime, repo: ai-code-reviewers-fake-runtime, scan: false}
    env:
      REPO: docker.io/${{ needs.meta.outputs.namespace }}/${{ matrix.repo }}
      BUILD_ARGS: |
        BASE=${{ needs.base.outputs.ref }}
        VERSION=${{ needs.meta.outputs.version }}
        REVISION=${{ needs.meta.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.meta.outputs.revision }}"}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build for scanning (local, amd64)
        if: matrix.scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: ${{ matrix.target }}
          load: true
          build-args: ${{ env.BUILD_ARGS }}
          tags: acr-${{ matrix.target }}:scan
          cache-from: type=gha,scope=${{ matrix.target }}
      - name: Vulnerability gate (new critical/high block the push)
        if: matrix.scan
        run: infrastructure/scripts/security-scan.sh acr-${{ matrix.target }}:scan image
      - id: tags
        run: printf 'list<<EOF\n%s\nEOF\n' "$(for t in ${{ needs.meta.outputs.tags }}; do echo "$REPO:$t"; done)" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.target }} on base ${{ needs.base.outputs.ref }}
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: mode=max
          sbom: true
          build-args: ${{ env.BUILD_ARGS }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - run: cosign sign --yes "$REPO@${{ steps.push.outputs.digest }}"
      - run: echo "- \`$REPO@${{ steps.push.outputs.digest }}\` (base \`${{ needs.base.outputs.ref }}\`)" >> "$GITHUB_STEP_SUMMARY"
