name: CI
# Every PR and push to main: validate, lint, test, docs, benchmarks, container build,
# compose end-to-end, fixture reviews with schema validation, quality gates, and the
# platform's own review in three parallel lanes (code, security, docs) merged into one gate.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROGRESS: quiet   # build progress would otherwise land on stdout (captured outputs); errors still show

jobs:
  test:
    # Docker-first: the toolbox image carries every tool; the runner only needs Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolbox image
        run: docker compose build -q dev
      - name: Validate structure, manifests, rule examples, wrapper permissions, fixtures, pins, exceptions
        run: docker compose run --rm -T dev validate
      - name: Lint
        run: docker compose run --rm -T dev lint
      - name: Unit, contract, integration, regression, security tests (coverage gate)
        run: docker compose run --rm -T dev test
      - name: Generated docs and links
        run: docker compose run --rm -T dev docs-check
      - name: Benchmark quality gate (offline, deterministic)
        run: docker compose run --rm -T dev bench-gate
      - name: Fixture reviews -> JSON/SARIF/Markdown, schema-validated
        run: |
          for d in benchmarks/fixtures/*/ examples/sample-repo/; do
            n=$(basename "$d"); f="$d/diff.patch"; [ -f "$f" ] || f="$d/change.patch"
            docker compose run --rm -T dev review-offline --diff "$f" --out "out/reviews/$n" > /dev/null || true   # exit 1 = blocked; schema-check below fails on missing output
          done
          docker compose run --rm -T dev schema-check out/reviews/*/review.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports
          path: out/
          retention-days: 14

  python-compat:
    # Minimum supported interpreter: the same toolbox, built on Python 3.11.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_IMAGE: python:3.11-slim@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535
      ACR_TOOLBOX_IMAGE: acr-toolbox:py311
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose run --rm -T dev test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker compose run --rm -T dev build --image acr-reviewer:ci
      - name: Container runs non-root, read-only, rules-only
        run: |
          set +e
          docker run --rm -i --read-only --cap-drop ALL acr-reviewer:ci review --profile offline --format legacy < examples/sample-repo/change.patch
          [ $? -eq 1 ]
      - name: Compose end-to-end (fake runtime, health checks, smoke, shutdown)
        run: docker compose run --rm -T dev e2e
      - name: Deploy to disposable environment with rollback check
        run: |
          docker tag acr-reviewer:ci acr-reviewer:ci-verified
          docker compose run --rm -T dev deploy-test --image acr-reviewer:ci-verified
          printf 'FROM acr-reviewer:ci\nENTRYPOINT ["python","-c","import time; time.sleep(600)"]\n' | docker build -q -t acr-reviewer:ci-broken -
          if DEPLOY_TIMEOUT=45 docker compose run --rm -T dev deploy-test --image acr-reviewer:ci-broken; then echo "broken image deployed" >&2; exit 1; fi
          docker ps --filter label=com.docker.compose.project=acr-test --format '{{.Image}}' | grep -qx acr-reviewer:ci-verified
          docker compose run --rm -T dev teardown
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-diagnostics
          path: out/
          retention-days: 7

  review:
    # Dogfooding, in three parallel lanes. Each runs the reviewer with rules plus a real local
    # model (qwen2.5-coder 1.5B on the CPU runner) on its own skill set; `review-gate` merges
    # them and enforces one gate. Pull requests are reviewed against their base, pushes to main
    # against the previous tip, so Release (and deployment) only follows reviewed commits.
    # Excluded paths carry attack and secret samples on purpose (rule tests, fixtures, the
    # documented review examples).
    name: review (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: code, skills: "code-quality.*,maintainability.*,testing.*,architecture.*,performance.*,lang.*"}
          - {lane: security, skills: "security.*"}
          - {lane: docs, skills: "documentation.*,refinement.*"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: ./integrations/github
        with:
          profile: balanced
          skills: ${{ matrix.skills }}
          base-ref: ${{ github.event_name == 'push' && github.event.before || '' }}
          # CI pulls into stock Ollama; on a user's machine the runtime image has the model baked in.
          runtime-image: ollama/ollama:0.40.11@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
          pull-models: qwen2.5-coder:1.5b
          paths: ':!benchmarks/fixtures :!skills/security/secrets :!tests/unit/test_rules.py :!tests/unit/test_analyzers.py :!tests/integration/test_review_pipeline.py :!docs/usage/examples.md'
          output-dir: acr-review-${{ matrix.lane }}
          artifact-name: review-${{ matrix.lane }}
          comment: 'false'
          enforce: 'false'     # the merged gate decides

  review-gate:
    # One result from the three lanes: findings de-duplicated, coverage judged across lanes,
    # one PR comment, one gate. Blocks on major findings, uncovered files or a missing model.
    needs: review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: review-*, path: lanes}
      - uses: ./integrations/github
        with:
          merge-results: lanes/review-code/review.json lanes/review-security/review.json lanes/review-docs/review.json
          lane-names: code,security,docs
          require-model: 'true'
          enforce: 'true'
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
