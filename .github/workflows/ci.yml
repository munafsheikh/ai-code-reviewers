name: CI
# Every PR and push to main: validate, lint, test, docs, benchmarks, container build,
# compose end-to-end, fixture reviews with schema validation, quality gates.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Docker-first: the toolbox image carries every tool; the runner only needs Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolbox image
        run: make toolbox
      - name: Validate structure, manifests, rule examples, wrapper permissions, fixtures, pins, exceptions
        run: make validate
      - name: Lint
        run: make lint
      - name: Unit, contract, integration, regression, security tests (coverage gate)
        run: make test
      - name: Generated docs and links
        run: make docs-check
      - name: Benchmark quality gate (offline, deterministic)
        run: make bench-gate
      - name: Fixture reviews -> JSON/SARIF/Markdown, schema-validated
        run: |
          for d in benchmarks/fixtures/*/ examples/sample-repo/; do
            n=$(basename "$d"); f="$d/diff.patch"; [ -f "$f" ] || f="$d/change.patch"
            make -s review-offline DIFF="$f" OUT="out/reviews/$n" > /dev/null || true   # exit 1 = blocked; schema-check below fails on missing output
          done
          make schema-check FILES="$(ls out/reviews/*/review.json | tr '\n' ' ')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports
          path: out/
          retention-days: 14

  python-compat:
    # Minimum supported interpreter: the same toolbox, built on Python 3.11.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_IMAGE: python:3.11-slim@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: make build IMAGE=acr-reviewer:ci
      - name: Container runs non-root, read-only, rules-only
        run: |
          set +e
          docker run --rm -i --read-only --cap-drop ALL acr-reviewer:ci review --profile offline --format legacy < examples/sample-repo/change.patch
          [ $? -eq 1 ]
      - name: Compose end-to-end (fake runtime, health checks, smoke, shutdown)
        run: make e2e
      - name: Deploy to disposable environment with rollback check
        run: |
          docker tag acr-reviewer:ci acr-reviewer:ci-verified
          infrastructure/deployment/deploy.sh acr-reviewer:ci-verified
          printf 'FROM acr-reviewer:ci\nENTRYPOINT ["python","-c","import time; time.sleep(600)"]\n' | docker build -q -t acr-reviewer:ci-broken -
          if DEPLOY_TIMEOUT=45 infrastructure/deployment/deploy.sh acr-reviewer:ci-broken; then echo "broken image deployed" >&2; exit 1; fi
          docker ps --filter label=com.docker.compose.project=acr-test --format '{{.Image}}' | grep -qx acr-reviewer:ci-verified
          infrastructure/deployment/teardown.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-diagnostics
          path: out/
          retention-days: 7

  self-review:
    # Dogfooding, enforced: the platform reviews its own pull requests with every code and
    # documentation category in one pass: deterministic rules plus a real local model
    # (Ollama + qwen2.5-coder 1.5B on the CPU runner, `balanced` profile). The gate blocks on
    # major findings, on any changed file no check covered, and when the model did not run.
    # Excluded: files that carry attack and secret samples on purpose (rule tests, fixtures).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: ./integrations/github
        with:
          profile: balanced
          pull-models: qwen2.5-coder:1.5b
          require-model: 'true'
          paths: ':!benchmarks/fixtures :!skills/security/secrets :!tests/unit/test_rules.py :!tests/integration/test_review_pipeline.py'
          enforce: 'true'
          comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
