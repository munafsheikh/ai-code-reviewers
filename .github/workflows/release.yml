name: Release
# Tag vX.Y.Z -> verify -> build multi-arch -> scan (gate) -> SBOM -> push to GHCR -> sign + attest -> GitHub release.
# The `release` environment should require reviewer approval (Settings > Environments).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write        # GitHub release
      packages: write        # GHCR push
      id-token: write        # keyless signing
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version from tag must match pyproject and CHANGELOG
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$v\"" pyproject.toml
          grep -q "^## \[$v\]" CHANGELOG.md
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for scanning (local, amd64)
        run: docker build -f infrastructure/docker/Dockerfile -t acr-reviewer:release --build-arg VERSION=${{ steps.v.outputs.version }} --build-arg REVISION=$GITHUB_SHA .
      - name: Vulnerability gate (new critical/high block the release)
        run: infrastructure/scripts/security-scan.sh acr-reviewer:release image
      - name: SBOM
        run: infrastructure/scripts/security-scan.sh acr-reviewer:release sbom
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64, arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image and attach SBOM attestation (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate out/security/sbom.cdx.json "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          v=${{ steps.v.outputs.version }}
          awk "/^## \[$v\]/{f=1;next}/^## \[/{f=0}f" CHANGELOG.md > notes.md
          printf '\n**Image:** `%s@%s`\n\nVerify: `cosign verify %s@%s --certificate-identity-regexp "^https://github.com/%s/" --certificate-oidc-issuer https://token.actions.githubusercontent.com`\n' \
            "$IMAGE" "$DIGEST" "$IMAGE" "$DIGEST" "${{ github.repository }}" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md out/security/sbom.cdx.json
