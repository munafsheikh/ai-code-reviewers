name: Release
# Automatic: every green CI run on main is a release candidate.
#   plan     next version from CHANGELOG [Unreleased] or a release:* label on the merged PR
#            (make release-plan; nothing to release -> stop)
#   bump     write the version everywhere (make release-apply), re-test the bumped tree in the
#            toolbox (make ci), commit "Release X.Y.Z" + tag vX.Y.Z, push both atomically to main
#   publish  reviewer image: scan gate, SBOM, push to GHCR, sign + attest, GitHub release
#   images   every layered image to Docker Hub (X.Y.Z, X.Y, latest)
#   deploy   disposable test environment with auto-rollback
#   docs     documentation site to GitHub Pages (every green main, from the release commit if one was cut)
# Pushes use GITHUB_TOKEN, so the release commit does not trigger CI again. Requires that
# github-actions may push to main (no branch protection blocking it, or a bypass for it).
# Manual: run with `version` (+ `commit`) to tag and publish an existing version, or with
# `bump` to force a level. A vX.Y.Z tag pushed by a person publishes that tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      bump:
        description: auto = from CHANGELOG [Unreleased]; or force a level
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: publish this existing version instead (X.Y.Z; tags `commit` first if untagged)
        type: string
        default: ""
      commit:
        description: commit to tag for `version` (default tip of main)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # tag an existing version (manual `version`)
      pull-requests: read      # labels of the merged PR
    outputs:
      mode: ${{ steps.p.outputs.mode }}          # bump | publish | none
      version: ${{ steps.p.outputs.version }}
      sha: ${{ steps.p.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || inputs.commit || 'main' }}
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "- $1: \`$2\`" >> "$GITHUB_STEP_SUMMARY"; }
          sha=$(git rev-parse HEAD); out sha "$sha"
          if [ "$EVENT" = push ] || [ -n "$VERSION" ]; then
            v="${VERSION:-${GITHUB_REF_NAME#v}}"; v="${v#v}"
            make -s release-check VERSION="$v"
            if ! git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
              git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a "v$v" -m "v$v" "$sha"
              git push origin "v$v"
            fi
            out mode publish; out version "$v"; exit 0
          fi
          if [ "$EVENT" = workflow_run ] && [ "$HEAD_SHA" != "$sha" ]; then
            echo "main moved past $HEAD_SHA; the CI run for $sha releases it" >> "$GITHUB_STEP_SUMMARY"
            out mode none; exit 0
          fi
          labels=""
          if [ "$EVENT" = workflow_run ]; then
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '[.[0].labels[]?.name] | join(" ")' || true)
          elif [ "${BUMP:-auto}" != auto ]; then
            labels="release:$BUMP"
          fi
          plan=$(make -s release-plan LABELS="$labels"); echo "$plan"
          v=$(jq -r '.next // empty' <<<"$plan")
          echo "- plan: \`$plan\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$v" ]; then out mode none; exit 0; fi
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "::error::v$v already exists"; exit 1; fi
          out mode bump; out version "$v"

  bump:
    needs: plan
    if: needs.plan.outputs.mode == 'bump'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # push the release commit and tag to main
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - name: Write version ${{ env.VERSION }}
        run: make release-apply VERSION="$VERSION"
      - name: Re-test the bumped tree (validate, lint, tests, docs, benchmark gate)
        run: make ci
      - name: Commit, tag, push atomically
        id: push
        run: |
          set -euo pipefail
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "Release $VERSION"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: [plan, bump]
    if: always() && (needs.plan.outputs.mode == 'publish' || (needs.plan.outputs.mode == 'bump' && needs.bump.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write        # GitHub release
      packages: write        # GHCR push
      id-token: write        # keyless signing
      attestations: write
    outputs:
      sha: ${{ steps.v.outputs.sha }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "v${{ needs.plan.outputs.version }}"}
      - name: Every version reference must equal the tag
        id: v
        run: |
          make release-check VERSION="$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test a hand-made tag (the automatic path tested it in `bump`)
        if: needs.plan.outputs.mode == 'publish'
        run: make ci
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for scanning (local, amd64)
        run: make build IMAGE=acr-reviewer:release
      - name: Vulnerability gate (new critical/high block the release)
        run: make security-image IMAGE=acr-reviewer:release
      - name: SBOM
        run: make sbom IMAGE=acr-reviewer:release
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64, arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: reviewer
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ steps.v.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image and attach SBOM attestation (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate out/security/sbom.cdx.json "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          make -s release-notes VERSION="$VERSION" > notes.md
          printf '\n**Image:** `%s@%s`\n\nVerify: `cosign verify %s@%s --certificate-identity-regexp "^https://github.com/%s/" --certificate-oidc-issuer https://token.actions.githubusercontent.com`\n' \
            "$IMAGE" "$DIGEST" "$IMAGE" "$DIGEST" "${{ github.repository }}" >> notes.md
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md out/security/sbom.cdx.json

  images:
    needs: [plan, publish]
    if: always() && needs.publish.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      revision: ${{ needs.publish.outputs.sha }}
    secrets: inherit

  deploy:
    needs: [plan, images]
    if: always() && needs.images.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      image: ghcr.io/${{ github.repository }}:${{ needs.plan.outputs.version }}

  docs:
    needs: [plan, bump]
    if: always() && needs.plan.result == 'success' && needs.bump.result != 'failure' && needs.bump.result != 'cancelled'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.bump.outputs.sha || needs.plan.outputs.sha }}
