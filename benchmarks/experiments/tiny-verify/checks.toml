# Hyperspecific checks for the candidate -> verify experiment.
#
# candidate  high-recall regex applied to the marked line (the "tool" that finds places to look)
# question   the single yes/no question a tiny model answers about that place
# tool       optional deterministic verifier that answers the same question without a model
#            ("py-ast-timeout", "py-ast-sql", "shellcheck:SC2086", "shellcheck:SC2115")
# kind       semantic: needs judgement about meaning; structural: decidable from syntax

[[check]]
id = "py.random-secret"
lang = "python"
kind = "semantic"
candidate = '\brandom\.\w+\('
question = "Is the value produced by Python's random module on the marked line used as a secret, token, password, key, salt, nonce, one-time code or other security-sensitive value?"

[[check]]
id = "py.assert-guard"
lang = "python"
kind = "semantic"
candidate = '^\s*assert\b'
question = "Does the assert on the marked line enforce an authentication, authorization or user/request input check that must still run in production (where python -O strips asserts)?"

[[check]]
id = "py.sql-format"
lang = "python"
kind = "structural"
candidate = '\.execute(?:many)?\s*\('
tool = "py-ast-sql"
question = "Is the SQL string passed to execute() on the marked line built with string formatting or concatenation of a variable (f-string, %, +, .format), instead of placeholders with separate parameters?"

[[check]]
id = "py.http-timeout"
lang = "python"
kind = "structural"
candidate = '\b(?:requests|httpx)\.(?:get|post|put|patch|delete|head|request)\s*\('
tool = "py-ast-timeout"
question = "Does the HTTP call that starts on the marked line lack a timeout= argument?"

[[check]]
id = "java.money-double"
lang = "java"
kind = "semantic"
candidate = '\b(?:double|float|Double|Float)\s+\w+\s*[=;,)]'
question = "Does the double/float variable declared on the marked line hold a monetary amount (price, balance, fee, payment, salary or another currency value)?"

[[check]]
id = "java.bigdecimal-equals"
lang = "java"
kind = "semantic"
candidate = '\.equals\s*\('
question = "Is the .equals() call on the marked line comparing two BigDecimal values?"

[[check]]
id = "java.log-secret"
lang = "java"
kind = "semantic"
candidate = '\b(?:log|logger|LOG|LOGGER)\.(?:trace|debug|info|warn|error)\s*\('
question = "Does the log statement on the marked line write a password, secret, token, API key, full card number or other credential value?"

[[check]]
id = "bash.unquoted-var"
lang = "shell"
kind = "structural"
candidate = '\$\{?[A-Za-z_]'
tool = "shellcheck:SC2086"
question = "Is a variable expansion on the marked line left unquoted in a command argument, where word splitting or globbing could change the command?"

[[check]]
id = "bash.rm-empty-var"
lang = "shell"
kind = "semantic"
candidate = '\brm\s+-[a-zA-Z]*[rR]'
tool = "shellcheck:SC2115"
question = "Could the rm command on the marked line delete / or an unintended directory if a variable in its path were empty or unset (no ${VAR:?} guard and no check before it)?"

