# ai-code-reviewers — local stack.
#   docker compose --profile model up -d --build   reviewer + model runtime with the model baked in
#   docker compose --profile test up -d --build    reviewer + deterministic fake runtime, no weights
#   docker compose down                            stop and remove containers (volumes are kept)
#   docker compose run --rm dev <task>             development and CI tasks (`help` lists them)
name: ai-code-reviewers

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp:size=64m,mode=1777"]

services:
  reviewer:
    <<: *hardening
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: reviewer
      args:
        VERSION: ${ACR_VERSION:-0.0.0-dev}
    image: ${ACR_IMAGE:-acr-reviewer:local}
    command: ["serve", "--profile", "${ACR_PROFILE:-balanced}"]
    environment:
      ACR_MODEL_HOST: ${ACR_MODEL_HOST:-http://llm-runtime:11434}
      ACR_SMALL_MODEL: ${ACR_SMALL_MODEL:-qwen2.5-coder-1.5b}
      ACR_LARGE_MODEL: ${ACR_LARGE_MODEL:-qwen2.5-coder-7b}
      ACR_PORT: "8088"
      ACR_MAX_CONCURRENT_REVIEWS: ${ACR_MAX_CONCURRENT_REVIEWS:-2}
    ports:
      - "127.0.0.1:${ACR_HOST_PORT:-8088}:8088"   # loopback only
    volumes:
      - acr-cache:/var/cache/acr
      - ${ACR_WORKDIR:-./examples}:/work:ro        # code under review is mounted read-only
      - ${ACR_INSTRUCTIONS_PATH:-./config/instructions.d}:/etc/acr/instructions.d:ro   # team review instructions (*.md)
      - ${ACR_SKILLS_PATH:-./config/skills.d}:/etc/acr/skills.d:ro                       # extra skills (rules / prompts)
    networks: [backend, edge]
    depends_on:
      llm-runtime: {condition: service_healthy, required: false}
      fake-runtime: {condition: service_healthy, required: false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8088/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      resources:
        limits: {cpus: "${ACR_CPUS:-1.0}", memory: "${ACR_MEMORY:-512m}"}

  llm-runtime:
    # Ollama with the model weights baked into the image at build time (Dockerfile `runtime`
    # target): it never downloads anything, so it sits only on the internal network.
    # Use a published one with LLM_RUNTIME_IMAGE=munafsheikh/ai-code-reviewers-runtime:<version>.
    <<: *hardening
    profiles: ["model"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: runtime
      args:
        MODELS: ${ACR_RUNTIME_MODELS:-qwen2.5-coder:1.5b}
    image: ${LLM_RUNTIME_IMAGE:-acr-runtime:local}
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    networks: [backend]                             # internal only: no route to the internet
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "${LLM_CPUS:-4.0}", memory: "${LLM_MEMORY:-6g}"}

  fake-runtime:
    <<: *hardening
    profiles: ["test"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: fake-runtime
    image: ${ACR_FAKE_RUNTIME_IMAGE:-acr-fake-runtime:local}
    networks:
      backend:
        aliases: [llm-runtime]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:11434/api/tags', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10

  dev:
    # Toolbox (pinned Python tooling, git, Docker CLI) running infrastructure/tasks.py. The
    # repository is mounted at the host's own path and the host's Docker socket is shared, so
    # tasks that build or run containers pass paths the host daemon understands. Runs as root
    # for the socket; files it creates are handed back to the repository's owner on exit.
    profiles: ["dev"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: toolbox
      args: [PYTHON_IMAGE]                          # unset: the Dockerfile's pinned default
    image: ${ACR_TOOLBOX_IMAGE:-acr-toolbox:local}
    pull_policy: build                              # rebuilt (from cache) before every run, never stale
    user: "0:0"
    working_dir: ${PWD}
    entrypoint: ["python", "infrastructure/tasks.py"]
    network_mode: host
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ACR_CACHE_DIR=/tmp/acr-cache
      - COMPOSE_PROJECT_NAME=acr-dev                # stacks the tasks start never touch this one
      - PYTHONDONTWRITEBYTECODE=1
      - BASE_URL
      - DEPLOY_TIMEOUT
      - SCAN_DOCKER_ARGS
      - ACR_TEST_PROJECT
      - ACR_TEST_PORT
      - ACR_STATE_DIR
      - ACR_IMAGE
      - ACR_MODEL_HOST
      - ACR_MIN_CONFIDENCE

networks:
  backend:
    internal: true          # no route to the internet
  edge: {}

volumes:
  acr-cache: {}
