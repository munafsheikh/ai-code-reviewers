# Compact MIT-licensed model; needs Ollama >= 0.5.13.
id = "phi4-mini-3.8b"
interface = "acr.model/v1"
family = "phi4"
tier = "small"
kind = "instruct"
architecture = "dense"
params_b = 3.8
status = "candidate"          # candidate -> approved: pinned digest + benchmark run (model-matrix workflow)
license = "MIT"
license_class = "permissive"
license_url = "https://huggingface.co/microsoft/Phi-4-mini-instruct/blob/main/LICENSE"
capabilities = ["review.diff", "lang.java", "lang.python", "lang.javascript", "lang.typescript"]
evidence = ["https://registry.ollama.ai/library/phi4-mini", "https://huggingface.co/microsoft/Phi-4-mini-instruct"]

[source]
runtime = "ollama"
ref = "phi4-mini:3.8b"
url = "https://ollama.com/library/phi4-mini"
upstream = "https://huggingface.co/microsoft/Phi-4-mini-instruct"
hf = "microsoft/Phi-4-mini-instruct"

[integrity]
algorithm = "sha256"
digest = ""                   # pin with: acr models verify --pin (records the runtime-reported digest)

[limits]
