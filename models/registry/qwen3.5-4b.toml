# Strong small general model for laptops.
id = "qwen3.5-4b"
interface = "acr.model/v1"
family = "qwen3.5"
tier = "small"
kind = "instruct"
architecture = "dense"
params_b = 4.0
status = "candidate"          # candidate -> approved: pinned digest + benchmark run (model-matrix workflow)
license = "Apache-2.0"
license_class = "permissive"
license_url = "https://huggingface.co/Qwen/Qwen3.5-4B"
capabilities = ["review.diff", "lang.java", "lang.python", "lang.javascript", "lang.typescript"]
evidence = ["https://artificialanalysis.ai/articles/qwen3-5-small-models"]

[source]
runtime = "ollama"
ref = "qwen3.5:4b"
url = "https://ollama.com/library/qwen3.5"
upstream = "https://huggingface.co/Qwen/Qwen3.5-4B"
hf = "Qwen/Qwen3.5-4B"

[integrity]
algorithm = "sha256"
digest = ""                   # pin with: acr models verify --pin (records the runtime-reported digest)

[limits]
context_tokens = 262144

[resources]                   # approximate, Q4-class weights
min_ram_mb = 4096
