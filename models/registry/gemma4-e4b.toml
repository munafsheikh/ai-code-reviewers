# Gemma 4 is Apache-2.0 (earlier Gemma used custom terms). Context set conservatively; upstream advertises more.
id = "gemma4-e4b"
interface = "acr.model/v1"
family = "gemma4"
tier = "small"
kind = "instruct"
architecture = "dense"
params_b = 4.0
status = "candidate"          # candidate -> approved: pinned digest + benchmark run (model-matrix workflow)
license = "Apache-2.0"
license_class = "permissive"
license_url = "https://ai.google.dev/gemma"
capabilities = ["review.diff", "lang.java", "lang.python", "lang.javascript", "lang.typescript"]
evidence = ["https://the-decoder.com/googles-gemma-4-is-now-available-with-apache-2-0-licensing-for-the-first-time/", "https://jacar.es/en/gemma-4-locally-with-ollama/"]

[source]
runtime = "ollama"
ref = "gemma4:e4b"
url = "https://ollama.com/library/gemma4"
upstream = "https://huggingface.co/google/gemma-4-E4B-it"
hf = "google/gemma-4-E4B-it"

[integrity]
algorithm = "sha256"
digest = ""                   # pin with: acr models verify --pin (records the runtime-reported digest)

[limits]
context_tokens = 32768

[resources]                   # approximate, Q4-class weights
min_ram_mb = 6144
recommended_ram_mb = 8192
disk_mb = 5000
gpu = "optional"
