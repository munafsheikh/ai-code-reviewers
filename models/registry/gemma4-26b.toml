# MoE variant; context set conservatively.
id = "gemma4-26b"
interface = "acr.model/v1"
family = "gemma4"
tier = "large"
kind = "instruct"
architecture = "moe"
params_b = 26.0
active_params_b = 4.0
status = "candidate"          # candidate -> approved: pinned digest + benchmark run (model-matrix workflow)
license = "Apache-2.0"
license_class = "permissive"
license_url = "https://ai.google.dev/gemma"
capabilities = ["review.diff", "lang.java", "lang.python", "lang.javascript", "lang.typescript"]
evidence = ["https://the-decoder.com/googles-gemma-4-is-now-available-with-apache-2-0-licensing-for-the-first-time/", "https://dev.to/purpledoubled/how-to-run-googles-gemma-4-locally-with-ollama-all-4-model-sizes-compared-2pbh"]

[source]
runtime = "ollama"
ref = "gemma4:26b"
url = "https://ollama.com/library/gemma4"
upstream = "https://huggingface.co/google/gemma-4-26B-A4B-it"
hf = "google/gemma-4-26B-A4B-it"

[integrity]
algorithm = "sha256"
digest = ""                   # pin with: acr models verify --pin (records the runtime-reported digest)

[limits]
context_tokens = 32768

[resources]                   # approximate, Q4-class weights
min_ram_mb = 20480
recommended_ram_mb = 32768
disk_mb = 18000
gpu = "optional"              # CPU works; a GPU is recommended for interactive latency
