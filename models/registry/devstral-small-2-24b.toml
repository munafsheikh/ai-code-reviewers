# Software-engineering agent model (Dec 2025). The older `devstral` tag is the 2505/2507 release.
id = "devstral-small-2-24b"
interface = "acr.model/v1"
family = "devstral"
tier = "large"
kind = "code-instruct"
architecture = "dense"
params_b = 24.0
status = "candidate"          # candidate -> approved: pinned digest + benchmark run (model-matrix workflow)
license = "Apache-2.0"
license_class = "permissive"
license_url = "https://huggingface.co/mistralai/Devstral-Small-2-24B-Instruct-2512"
capabilities = ["review.diff", "lang.java", "lang.python", "lang.javascript", "lang.typescript"]
evidence = ["https://huggingface.co/mistralai/Devstral-Small-2-24B-Instruct-2512", "https://codersera.com/blog/run-devstral-locally-with-ollama/"]

[source]
runtime = "ollama"
ref = "devstral-small-2"
url = "https://ollama.com/library/devstral-small-2"
upstream = "https://huggingface.co/mistralai/Devstral-Small-2-24B-Instruct-2512"
hf = "mistralai/Devstral-Small-2-24B-Instruct-2512"

[integrity]
algorithm = "sha256"
digest = ""                   # pin with: acr models verify --pin (records the runtime-reported digest)

[limits]
context_tokens = 131072

[resources]                   # approximate, Q4-class weights
min_ram_mb = 16384
recommended_ram_mb = 32768
disk_mb = 15000
gpu = "optional"              # CPU works; a GPU is recommended for interactive latency
