id = "security.secrets"
version = "1.0.0"
interface = "acr.skill/v1"
category = "security"
description = "Hardcoded credentials, keys and tokens in added lines."
languages = ["*"]
file_globs = ["*"]
exclude_globs = ["*.lock", "*.sum", "*.min.js", "*.svg"]
tier = "none"

[[rules]]
id = "SEC-001"
title = "Private key committed"
severity = "critical"
confidence = "high"
pattern = '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-----'
explanation = "A private key in source control is compromised for every reader of the repository and its history."
remediation = "Remove the key, rotate it immediately, and load it from a secret store at runtime."
examples.match = ["-----BEGIN RSA PRIVATE KEY-----", "key = '''-----BEGIN PRIVATE KEY-----"]
examples.no_match = ["-----BEGIN PUBLIC KEY-----", "-----BEGIN CERTIFICATE-----"]

[[rules]]
id = "SEC-002"
title = "AWS access key id"
severity = "critical"
confidence = "high"
pattern = '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
unless = 'AKIAIOSFODNN7EXAMPLE'
explanation = "AWS access key ids are live credentials when paired with their secret."
remediation = "Revoke the key in IAM, rotate, and use instance roles or a secret manager."
examples.match = ['String k = "AKIAZ7Q3XJ5M2N4P6R8T";']
examples.no_match = ['String k = "AKIAIOSFODNN7EXAMPLE";', "AKIA123"]

[[rules]]
id = "SEC-003"
title = "GitHub / Slack token"
severity = "critical"
confidence = "high"
pattern = '\b(?:gh[pousr]_[A-Za-z0-9]{36,}|xox[baprs]-[A-Za-z0-9-]{10,})\b'
explanation = "Platform tokens grant API access with the issuing user's permissions."
remediation = "Revoke the token and inject it via CI secrets or environment variables."
examples.match = ["token = 'ghp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'"]
examples.no_match = ["token = os.environ['GITHUB_TOKEN']"]

[[rules]]
id = "SEC-004"
title = "Hardcoded password or secret"
severity = "major"
confidence = "medium"
pattern = '''(?i)(?<![a-z0-9])(?:password|passwd|pwd|secret|api[_-]?key|access[_-]?token|client[_-]?secret)(?![a-z0-9])["']?\s*[:=]\s*["'][^"'\s$\{]{6,}["']'''
unless = '''(?i)(?:example|changeme|dummy|placeholder|your[_-]|<|\*\*\*|test|fake|xxx)'''
explanation = "Credentials in code are shared with everyone who can read the repository and cannot be rotated without a release."
remediation = "Read the value from configuration or a secret manager; keep only references in code."
examples.match = ['String password = "s3cr3tP4ss";', "api_key: 'k9f8d7s6a5'", 'DB_PASSWORD="hunter2hunter2"']
examples.no_match = ['password = os.getenv("DB_PASSWORD")', 'password = "changeme"', 'String password = "${DB_PASS}";']
