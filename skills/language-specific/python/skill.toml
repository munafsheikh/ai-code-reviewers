id = "lang.python.core"
version = "1.2.0"
interface = "acr.skill/v1"
category = "code-quality"
description = "Python correctness, async, resource, typing-suppression and stdlib-security pitfalls."
languages = ["python"]
file_globs = ["*.py", "*.pyi"]
tier = "small"

# Shared concerns live in their own skills and are not repeated here:
# shell/eval/pickle/yaml/TLS (security.injection INJ-*), swallowed and bare except
# (code-quality.error-handling ERR-*), secrets (security.secrets SEC-*), test hygiene (TST-*).

[prompt]
file = "prompt.md"
output = "findings-json"

[[rules]]
id = "PY-001"
title = "Mutable default argument"
severity = "minor"
confidence = "high"
pattern = '^\s*(?:async\s+)?def\s+\w+\([^)]*=\s*(?:\[\]|\{\}|set\(\)|list\(\)|dict\(\))'
explanation = "Default values are evaluated once, so state leaks between calls."
remediation = "Default to None and create the container inside the function."
examples.match = ["def add(x, acc=[]):", "async def f(a, opts={}):"]
examples.no_match = ["def add(x, acc=None):"]

[[rules]]
id = "PY-002"
title = "assert used for runtime validation"
severity = "minor"
confidence = "low"
pattern = '^\s*assert\s+(?:request|user|is_|has_|.*\b(?:auth|permission|admin)\b)'
explanation = "assert statements are removed under python -O, silently disabling the check."
remediation = "Raise an explicit exception."
examples.match = ["    assert user.is_admin", "    assert request.method == 'POST'"]
examples.no_match = ["    assert result == 3"]

[[rules]]
id = "PY-003"
title = "Identity comparison with a literal"
severity = "major"
confidence = "high"
# The literal must end the expression, so prose in docstrings ("recall is 1.0 by ...") does not match.
pattern = '''\bis\s+(?:not\s+)?(?:-?\d[\d_.]*|[rbfu]?(?:"[^"\n]*"|'[^'\n]*')|\[\s*\]|\{\s*\})\s*(?:[:)\],]|\b(?:and|or|if|else)\b|#|$)'''
unless = '^\s*#'
explanation = "`is` compares object identity; equal ints and strings are only sometimes the same object, so the result depends on the interpreter (CPython emits SyntaxWarning)."
remediation = "Use == / != for values; keep `is` for None, True, False and sentinels."
examples.match = ["if code is 200:", "if name is not 'admin':", "while x is []:", "return status is 0", "ok = a is 1 and b"]
examples.no_match = ["if x is None:", "if flag is True:", "if obj is SENTINEL:", "# this is 'quoted'", "    candidate   flag every candidate (recall is 1.0 by construction)", "The default is 'auto' unless set."]

[[rules]]
id = "PY-004"
title = "Equality comparison with None"
severity = "minor"
confidence = "high"
pattern = '[!=]=\s*None\b|\bNone\s*[!=]='
unless = '^\s*#'
explanation = "__eq__ can be overridden (numpy, ORMs), so == None may not mean 'is None'."
remediation = "Use `is None` / `is not None`."
examples.match = ["if value == None:", "while node != None:"]
examples.no_match = ["if value is None:", "    # compare: x == None is wrong"]

[[rules]]
id = "PY-005"
title = "File opened without a context manager"
severity = "minor"
confidence = "medium"
pattern = '^\s*(?:\w+(?:\.\w+)*)\s*=\s*(?:io\.|codecs\.|gzip\.|bz2\.|lzma\.)?open\s*\('
explanation = "The handle is not closed on every path, leaking file descriptors and leaving writes unflushed on error."
remediation = "Use `with open(...) as fh:` (or pathlib read_text/write_text for one-shot I/O)."
examples.match = ["fh = open(path)", "    self.log = open('x.log', 'a')", "f = gzip.open(p, 'rt')"]
examples.no_match = ["with open(path) as fh:", "data = path.read_text()", "opener = open_conn()"]

[[rules]]
id = "PY-006"
title = "Naive or deprecated UTC datetime"
severity = "minor"
confidence = "medium"
pattern = '\bdatetime\.(?:utcnow|utcfromtimestamp)\s*\(|\bdatetime\.now\(\s*\)'
explanation = "utcnow()/utcfromtimestamp() are deprecated since 3.12 and return naive datetimes; naive now() uses host local time. Mixing naive and aware values raises or silently shifts times."
remediation = "Use datetime.now(timezone.utc) / datetime.fromtimestamp(ts, timezone.utc)."
examples.match = ["ts = datetime.utcnow()", "now = datetime.datetime.now()", "d = datetime.utcfromtimestamp(t)"]
examples.no_match = ["ts = datetime.now(timezone.utc)", "d = datetime.fromtimestamp(t, tz=UTC)"]

[[rules]]
id = "PY-007"
title = "HTTP request without timeout"
severity = "minor"
confidence = "low"
pattern = '\b(?:requests|httpx)\.(?:get|post|put|patch|delete|head|options|request)\s*\('
unless = '\btimeout\s*='
# The AST analyzer reads the whole call, including arguments on later lines: confirmed
# findings are reported as high confidence, and multi-line calls that do pass timeout= are dropped.
analyzer = "python.http-without-timeout"
explanation = "requests has no default timeout, so a stalled server hangs the caller (and its worker) indefinitely."
remediation = "Pass timeout=(connect, read) on every call, or use a Session/Client with a default timeout."
examples.match = ["r = requests.get(url)", "resp = requests.post(url, json=body)", "resp = requests.post(\n    url,\n    json=body,\n)"]
examples.no_match = ["r = requests.get(url, timeout=5)", "session.get(url)", "resp = requests.post(\n    url,\n    timeout=(3, 27),\n)", "requests.get(url, **opts)"]

[[rules]]
id = "PY-008"
title = "Blocking call inside async function"
severity = "major"
confidence = "medium"
scope = "block"
pattern = '''(?m)^[ \t]*async[ \t]+def\b[^\n]*\n(?:(?![ \t]*(?:async[ \t]+)?def\b)[^\n]*\n)*?[^\n]*?\b(?:time\.sleep|requests\.(?:get|post|put|patch|delete|head|request)|urllib\.request\.urlopen|subprocess\.(?:run|call|check_call|check_output))\s*\('''
explanation = "A synchronous blocking call stalls the event loop, freezing every other task on it."
remediation = "Use the async equivalent (asyncio.sleep, httpx.AsyncClient, asyncio.create_subprocess_exec) or asyncio.to_thread."
examples.match = ["async def poll():\n    time.sleep(1)", "async def fetch(u):\n    log.info(u)\n    return requests.get(u, timeout=5)"]
examples.no_match = ["async def poll():\n    await asyncio.sleep(1)", "async def a():\n    pass\ndef b():\n    time.sleep(1)"]

[[rules]]
id = "PY-009"
title = "Fire-and-forget asyncio task"
severity = "minor"
confidence = "medium"
pattern = '^\s*(?:asyncio\.)?(?:create_task|ensure_future)\s*\('
explanation = "The event loop keeps only a weak reference to tasks; an unreferenced task can be garbage-collected mid-run and its exception is never observed."
remediation = "Keep a reference (a set plus add_done_callback(discard)) or use asyncio.TaskGroup."
examples.match = ["    asyncio.create_task(worker())", "asyncio.ensure_future(job)"]
examples.no_match = ["    t = asyncio.create_task(worker())", "    tg.create_task(worker())", "await asyncio.create_task(x())"]

[[rules]]
id = "PY-010"
title = "Non-cryptographic random for a secret"
severity = "major"
confidence = "medium"
pattern = '''(?i)(?:token|password|passwd|secret|otp|nonce|salt|api_?key|session_?id)\w*\s*=.*\brandom\.(?:random|randint|randrange|choice|choices|sample|getrandbits)\s*\('''
explanation = "The random module is a predictable PRNG; values derived from it can be reproduced by an attacker."
remediation = "Use the secrets module (secrets.token_urlsafe, secrets.choice, secrets.randbelow)."
examples.match = ["token = ''.join(random.choices(chars, k=32))", "otp = random.randint(100000, 999999)"]
examples.no_match = ["token = secrets.token_urlsafe(32)", "jitter = random.random()"]

[[rules]]
id = "PY-011"
title = "Weak hash without usedforsecurity=False"
severity = "minor"
confidence = "medium"
pattern = '''\bhashlib\.(?:md5|sha1)\s*\(|\bhashlib\.new\s*\(\s*["'](?:md5|sha1)["']'''
unless = 'usedforsecurity\s*=\s*False'
explanation = "MD5 and SHA-1 are broken for integrity and passwords; FIPS builds also reject them unless marked non-security."
remediation = "Use sha256/blake2b, a password KDF (hashlib.scrypt, argon2) for passwords, or pass usedforsecurity=False for checksums/cache keys."
examples.match = ["h = hashlib.md5(data).hexdigest()", "hashlib.new('sha1', b)"]
examples.no_match = ["hashlib.md5(data, usedforsecurity=False)", "hashlib.sha256(data)"]

[[rules]]
id = "PY-012"
title = "Insecure temporary file name"
severity = "major"
confidence = "high"
pattern = '\btempfile\.mktemp\s*\(|(?<![\w.])mktemp\s*\('
explanation = "mktemp returns a name without creating the file; another process can create it first (race / symlink attack)."
remediation = "Use tempfile.NamedTemporaryFile, mkstemp or TemporaryDirectory."
examples.match = ["path = tempfile.mktemp()", "p = mktemp(suffix='.json')"]
examples.no_match = ["fd, path = tempfile.mkstemp()", "with tempfile.TemporaryDirectory() as d:"]

[[rules]]
id = "PY-013"
title = "Wildcard import"
severity = "minor"
confidence = "high"
pattern = '^\s*from\s+[\w.]+\s+import\s+\*'
explanation = "Star imports hide where names come from, shadow builtins and break static analysis."
remediation = "Import the names you use explicitly, or import the module."
examples.match = ["from os.path import *"]
examples.no_match = ["from os.path import join", "import os.path"]

[[rules]]
id = "PY-014"
title = "Blanket lint or type suppression"
severity = "minor"
confidence = "high"
pattern = '#\s*type:\s*ignore(?!\[)|#\s*noqa\b(?!:)|#\s*pyright:\s*ignore(?!\[)'
explanation = "An unscoped suppression silences every current and future diagnostic on the line, including real bugs."
remediation = "Scope it to the specific code (`# type: ignore[attr-defined]`, `# noqa: E501`) and say why."
examples.match = ["x = f()  # type: ignore", "import foo  # noqa", "y = g()  # pyright: ignore"]
examples.no_match = ["x = f()  # type: ignore[arg-type]", "import foo  # noqa: F401"]

[[rules]]
id = "PY-015"
title = "Exception re-raised without chaining"
severity = "minor"
confidence = "low"
scope = "block"
pattern = '''(?m)^([ \t]*)except\b[^\n]*\bas[ \t]+\w+[ \t]*:[ \t]*\n(?:\1[ \t]+[^\n]*\n)*?\1[ \t]+raise[ \t]+\w[\w.]*\((?![^\n]*\bfrom\b)[^\n]*$'''
explanation = "Raising a new exception inside a handler without `from` loses the explicit cause, and the traceback misleadingly reads 'during handling ... another exception occurred'."
remediation = "Use `raise NewError(...) from err` (or `from None` to deliberately hide the cause)."
examples.match = ["    except KeyError as e:\n        raise ConfigError('missing key')"]
examples.no_match = ["    except KeyError as e:\n        raise ConfigError('missing key') from e", "    except KeyError as e:\n        raise"]

[[rules]]
id = "PY-016"
title = "World-writable file permissions"
severity = "major"
confidence = "high"
pattern = '\bos\.(?:chmod|fchmod|makedirs|mkdir)\s*\([^)]*\b0o?7[0-7]7\b|\bchmod\s*\([^)]*\b0o?777\b'
explanation = "Mode xx7 lets any local user modify the file or directory."
remediation = "Grant the narrowest mode needed (0o600 / 0o644 for files, 0o700 / 0o755 for directories)."
examples.match = ["os.chmod(path, 0o777)", "os.makedirs(d, mode=0o777, exist_ok=True)"]
examples.no_match = ["os.chmod(path, 0o600)", "os.makedirs(d, exist_ok=True)"]
