name: AI code review (ai-code-reviewers)
description: Offline review of the pull-request diff with rules + a local model. Posts a PR comment, uploads SARIF, enforces the gate.
author: munafsheikh
branding: {icon: check-circle, color: blue}

inputs:
  profile:
    description: fast | balanced | deep | offline | legacy
    default: balanced
  policy:
    description: Review policy id (default from profile)
    default: ''
  base-ref:
    description: Base branch or commit SHA to diff against (default the PR base; on push use github.event.before)
    default: ''
  min-confidence:
    description: Report and gate only findings at or above this confidence (low | medium | high). Empty = the policy's min_confidence (default low)
    default: ''
  skills:
    description: Comma list of skill ids or globs to run instead of the profile's (one lane of a parallel review), e.g. "security.*"
    default: ''
  instructions:
    description: Space-separated files in the repository with team review instructions for the model (e.g. .github/review-instructions.md); $ACR_INSTRUCTIONS in the job environment is forwarded too
    default: ''
  merge-results:
    description: >-
      Space-separated review.json paths (globs allowed) from parallel lanes. When set, nothing is reviewed:
      the lanes are merged into one result (acr merge), then commented, uploaded and gated as usual.
    default: ''
  lane-names:
    description: Comma list of lane names for merge-results, in the same order
    default: ''
  head-ref:
    description: Commit to review (default the PR head commit, else the pushed commit). Set to HEAD to include local commits.
    default: ''
  paths:
    description: Space-separated git pathspecs to limit the diff (e.g. "*.java")
    default: ''
  model:
    description: Small-tier model (registry id or runtime ref). Empty = profile default.
    default: ''
  pull-models:
    description: Runtime refs the review needs; pulled only if the runtime image does not already contain them
    default: qwen2.5-coder:1.5b
  runtime-image:
    description: >-
      Model runtime image. Default: this release's runtime with qwen2.5-coder:1.5b baked in (no model download).
      A stock Ollama image works too (models are then pulled). Empty = no runtime (rules only).
    default: munafsheikh/ai-code-reviewers-runtime:0.8.0
  image:
    description: Reviewer image. Empty = build from this action's source (pinned by the ref you use).
    default: ''
  comment:
    description: Upsert a PR comment with the Markdown report
    default: 'true'
  enforce:
    description: Fail the job when the gate blocks
    default: 'true'
  require-model:
    description: Fail the job when the review ran degraded (model runtime or model unavailable) instead of passing on rules alone
    default: 'false'
  output-dir:
    description: Where review.{json,sarif,md,txt} are written
    default: acr-review
  upload-artifact:
    description: Upload the reports as a workflow artifact (linked from the review comment)
    default: 'true'
  artifact-name:
    description: Artifact name for the reports
    default: ai-code-review

outputs:
  gate:
    description: pass | warn | block | error
    value: ${{ steps.review.outputs.gate }}
  exit-code:
    description: 0 pass/warn, 1 block, 2 error
    value: ${{ steps.review.outputs.exit_code }}
  degraded:
    description: true when model-backed checks could not run and the review fell back to rules
    value: ${{ steps.review.outputs.degraded }}
  sarif:
    description: Path to the SARIF report
    value: ${{ inputs.output-dir }}/review.sarif

runs:
  using: composite
  steps:
    - name: Compute diff
      if: inputs.merge-results == ''
      shell: bash
      env:
        BASE: ${{ inputs.base-ref || github.event.pull_request.base.ref || github.event.repository.default_branch }}
        PATHS: ${{ inputs.paths }}
        # On pull requests HEAD is GitHub's ephemeral merge commit; review (and link) the PR head instead.
        HEAD_REF: ${{ inputs.head-ref || github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        # A new branch's push has an all-zero "before": review against the default branch instead.
        if [[ "$BASE" =~ ^0+$ ]]; then BASE="${{ github.event.repository.default_branch }}"; fi
        if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-tags --depth=200 origin "$BASE"
          base_rev="$BASE"
        else
          git fetch --no-tags --depth=200 origin "$BASE"
          base_rev="origin/$BASE"
        fi
        git cat-file -e "$HEAD_REF^{commit}" 2>/dev/null || git fetch --no-tags --depth=200 origin "$HEAD_REF"
        HEAD_REF_RESOLVED=$(git rev-parse "$HEAD_REF")
        read -r -a specs <<< "$PATHS"
        git -c core.fsmonitor=false diff --no-color --no-ext-diff --no-textconv "$base_rev...$HEAD_REF_RESOLVED" -- "${specs[@]}" > "$RUNNER_TEMP/acr.diff"
        echo "diff lines: $(wc -l < "$RUNNER_TEMP/acr.diff")"

    - name: Prepare reviewer image
      id: image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        if [ -z "$IMAGE" ]; then
          IMAGE="acr-reviewer:action-$(git -C "$GITHUB_ACTION_PATH" rev-parse --short HEAD 2>/dev/null || echo local)"
          docker build -q -f "$GITHUB_ACTION_PATH/../../infrastructure/docker/Dockerfile" -t "$IMAGE" "$GITHUB_ACTION_PATH/../.."
        else
          docker pull -q "$IMAGE"
        fi
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

    - name: Start model runtime
      if: inputs.merge-results == '' && inputs.runtime-image != '' && inputs.profile != 'offline'
      shell: bash
      env:
        RUNTIME_IMAGE: ${{ inputs.runtime-image }}
        MODELS: ${{ inputs.pull-models }}
      run: |
        set -euo pipefail
        docker network create acr-net >/dev/null 2>&1 || true
        docker run -d --name llm-runtime --network acr-net -v acr-models:/root/.ollama "$RUNTIME_IMAGE" >/dev/null
        for i in $(seq 1 30); do docker exec llm-runtime ollama list >/dev/null 2>&1 && break; sleep 2; done
        # A runtime image with the models baked in (munafsheikh/ai-code-reviewers-runtime) needs no pull.
        have=$(docker exec llm-runtime ollama list | awk 'NR>1 {print $1}')
        for m in $MODELS; do
          case " $(echo $have) " in *" $m "*|*" $m:latest "*) echo "$m: already in the image"; continue;; esac
          for attempt in 1 2 3; do docker exec llm-runtime ollama pull "$m" && break || sleep $((attempt * 5)); done
        done
        docker exec llm-runtime ollama list

    - name: Review
      id: review
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.image }}
        PROFILE: ${{ inputs.profile }}
        HEAD_REF: ${{ inputs.head-ref || github.event.pull_request.head.sha || github.sha }}
        POLICY: ${{ inputs.policy }}
        MODEL: ${{ inputs.model }}
        SKILLS: ${{ inputs.skills }}
        MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        INSTRUCTIONS: ${{ inputs.instructions }}
        MERGE: ${{ inputs.merge-results }}
        LANES: ${{ inputs.lane-names }}
        OUT: ${{ inputs.output-dir }}
      run: |
        set +e -uo pipefail   # composite steps run with bash -e; the exit code is handled below
        mkdir -p "$OUT" && chmod 0777 "$OUT"
        if [ -n "$MERGE" ]; then
          mounts=(); files=(); i=0
          for f in $MERGE; do mounts+=(-v "$PWD/$f:/in/$i.json:ro"); files+=("/in/$i.json"); i=$((i + 1)); done
          [ "$i" -gt 0 ] || { echo "::error::merge-results matched no files"; exit 2; }
          args=(merge "${files[@]}" --format json,sarif,markdown,legacy --out-dir /out --stdout markdown)
          [ -n "$LANES" ] && args+=(--names "$LANES")
          [ -n "$MIN_CONFIDENCE" ] && args+=(--min-confidence "$MIN_CONFIDENCE")
          [ -n "$POLICY" ] && args+=(--policy "$POLICY")
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true --network none \
            --tmpfs /tmp -v "$PWD/$OUT:/out" "${mounts[@]}" "$IMAGE" "${args[@]}" 2> "$OUT/review.log"
          code=$?
        else
          HEAD_REF_RESOLVED=$(git rev-parse "$HEAD_REF")
          net=(); docker network inspect acr-net >/dev/null 2>&1 && net=(--network acr-net)
          args=(review --profile "$PROFILE" --format json,sarif,markdown,legacy --out-dir /out --stdout markdown -v
                --revision "$HEAD_REF_RESOLVED" --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY")
          [ -n "$POLICY" ] && args+=(--policy "$POLICY")
          [ -n "$MODEL" ] && args+=(--model "$MODEL")
          [ -n "$SKILLS" ] && args+=(--skills "$SKILLS")
          [ -n "$MIN_CONFIDENCE" ] && args+=(--min-confidence "$MIN_CONFIDENCE")
          # Added to any instructions baked into the image (/etc/acr/instructions.d), not instead of them.
          imounts=(); n=0
          for f in $INSTRUCTIONS; do
            [ -f "$f" ] || { echo "::error::instructions file not found: $f"; exit 2; }
            target="/opt/acr-action/instructions/$n-$(basename "$f")"
            imounts+=(-v "$PWD/$f:$target:ro"); args+=(--instructions "$target"); n=$((n + 1))
          done
          docker run --rm -i "${net[@]}" --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp -v "$PWD/$OUT:/out" -e ACR_MODEL_HOST=http://llm-runtime:11434 \
            -e ACR_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            ${LLM_MODEL:+-e LLM_MODEL="$LLM_MODEL"} ${ACR_INSTRUCTIONS:+-e ACR_INSTRUCTIONS} "${imounts[@]}" \
            "$IMAGE" "${args[@]}" < "$RUNNER_TEMP/acr.diff" 2> "$OUT/review.log"
          code=$?
        fi
        cat "$OUT/review.log" >&2
        read -r gate degraded < <(docker run --rm -i --entrypoint python "$IMAGE" -c \
          'import json,sys; r=json.load(sys.stdin); print(r["gate"]["status"], str(r["run"]["degraded"]).lower())' \
          < "$OUT/review.json" 2>/dev/null || echo "error true")
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        echo "gate=$gate" >> "$GITHUB_OUTPUT"
        echo "degraded=$degraded" >> "$GITHUB_OUTPUT"
        [ -f "$OUT/review.md" ] && cat "$OUT/review.md" >> "$GITHUB_STEP_SUMMARY"
        exit 0

    - name: Keep the reports (linked from the review comment)
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}/
        retention-days: 90
        if-no-files-found: ignore

    - name: Comment on PR
      if: inputs.comment == 'true' && github.event.pull_request.number
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REPORT: ${{ inputs.output-dir }}/review.md
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- acr-review -->';
          const report = fs.existsSync(process.env.REPORT) ? fs.readFileSync(process.env.REPORT, 'utf8') : 'Review did not produce a report; see job logs.';
          const body = `${marker}\n${report}`.slice(0, 65000);
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });

    - name: Stop model runtime
      if: always()
      shell: bash
      run: docker rm -f llm-runtime >/dev/null 2>&1 || true

    - name: Require the model
      if: inputs.require-model == 'true' && steps.review.outputs.degraded != 'false'
      shell: bash
      run: |
        echo "::error::Review ran degraded (rules only): the model runtime or model was unavailable. See review.log."
        exit 2

    - name: Enforce gate
      if: inputs.enforce == 'true' && steps.review.outputs.exit_code != '0'
      shell: bash
      env:
        CODE: ${{ steps.review.outputs.exit_code }}
        GATE: ${{ steps.review.outputs.gate }}
      run: |
        echo "::error::AI review gate: $GATE (exit $CODE). See the PR comment / job summary."
        exit "$CODE"
